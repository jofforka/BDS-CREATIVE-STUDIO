<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Administration | BDS</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="studio-admin.css"></head><body><main class="studio-admin"><a href="index.html">← BDS Creative Studios</a><h1>Studio administration</h1><p id="status" role="status" aria-live="polite"></p><form id="login"><h2>Administrator sign-in</h2><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><section id="dashboard" hidden><button id="logout">Sign out</button><h2>Services & pricing</h2><form id="service-form"><label>Category and package (Category — Package)<input name="name" required maxlength="200"></label><label>Price in NGN<input name="price" type="number" min="0" max="100000000" step="0.01" required></label><label>Duration in minutes (optional)<input name="duration" type="number" min="1" max="10080"></label><label><input name="active" type="checkbox" checked> Active</label><button type="submit">Save package</button><button id="reset" type="button">New package</button></form><div id="services"></div><h2>Appointments</h2><div id="bookings"></div><h2>Record verified payment</h2><form id="payment-form"><label>Appointment<select name="booking" required><option value="">Select appointment</option></select></label><label>Payment reference<input name="reference" maxlength="120" required></label><label>Amount received (NGN)<input name="amount" type="number" min="0.01" max="100000000" step="0.01" required></label><label><input type="checkbox" required> I have independently verified receipt of these funds.</label><button type="submit">Record verified payment</button></form><h2>Payment records</h2><div id="payments"></div><p>Appointments remain read-only. Payment records must correspond to independently verified funds.</p></section></main><script src="academy-config.js"></script><script src="studio-admin.js" defer></script></body></html>
