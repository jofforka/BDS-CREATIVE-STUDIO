name: BDS First Preview
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview files
        run: |
          test -s index.html
          test -s styles.css
          test -s booking.html
          test -s booking.css
          test -s booking.js
          test -s assets/bds-logo.png
      - name: Create preview bundle
        run: zip -r bds-first-preview.zip *.html *.css *.js assets content
      - uses: actions/upload-artifact@v4
        with:
          name: bds-first-preview
          path: bds-first-preview.zip
          retention-days: 14
  api-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
