name: Deploy BDS Website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'booking.html'
      - 'booking.css'
      - 'booking.js'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static website
        run: |
          test -s index.html
          test -s styles.css
          test -s booking.html
          test -s booking.css
          test -s booking.js
          test -s assets/bds-logo.png
      - name: Stage only public assets
        run: |
          mkdir -p public
          cp index.html styles.css booking.html booking.css booking.js public/
          cp -R assets public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
