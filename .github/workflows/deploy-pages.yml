name: Deploy BDS Website
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'content/**'
      - 'assets/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static website
        run: |
          test -s index.html
          test -s brand.html
          test -s academy.html
          test -s academy-resources.html
          test -s academy-resources.js
          test -s academy-assessments.html
          test -s academy-assessments.js
          test -s academy-instructor.html
          test -s academy-instructor.js
          test -s academy-workspace.html
          test -s academy-workspace.css
          test -s academy-workspace.js
          test -s academy-course-model.js
          test -s academy-learn.html
          test -s academy-learn.css
          test -s academy-learn.js
          test -s academy-verify.html
          test -s academy-verify.css
          test -s academy-verify.js
          test -s academy-portal.html
          test -s academy-portal.css
          test -s academy-portal.js
          test -s academy-config.js
          test -s academy-course.html
          test -s academy.css
          test -s academy.js
          test -s academy-course.js
          python3 -m json.tool content/academy-catalog.json > /dev/null
          test -s contact.html
          test -s destination.css
          test -s photography.html
          test -s film.html
          test -s sound.html
          test -s showcase.css
          test -s hero-globe.css
          test -s showcase.js
          test -s portfolio.js
          test -s portfolio-admin.html
          test -s portfolio-admin.js
          test -s portfolio-admin.css
          test -s orbit-gallery.js
          test -s content/portfolio.json
          test -s showcase-data.js
          test -s styles.css
          test -s cinematic.css
          test -s cinematic.js
          test -s premium-ui.css
          test -s signature-ui.css
          test -s marquee-fix.css
          test -s compact-layout.css
          test -s premium-ui.js
          test -s premium-booking-admin.css
          test -s premium-booking-admin.js
          test -s booking.html
          test -s booking.css
          test -s booking-premium.css
          test -s booking.js
          test -s assets/bds-logo.png
      - name: Validate JavaScript syntax
        run: |
          for script in *.js; do node --check "$script"; done
          node scripts/test_academy_course_model.cjs
      - name: Validate site assets and portfolio data
        run: python3 scripts/validate_site.py
      - name: Audit Academy release prerequisites
        run: python3 scripts/audit_academy_release.py
      - name: Check Academy database schema contracts
        run: python3 scripts/test_academy_schema_contracts.py
      - name: Stage only public assets
        run: |
          mkdir -p public
          cp -- *.html *.css *.js public/
          cp -R -- assets content public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
