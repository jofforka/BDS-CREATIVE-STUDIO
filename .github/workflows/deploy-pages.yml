name: Deploy BDS Website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'photography.html'
      - 'film.html'
      - 'sound.html'
      - 'showcase.css'
      - 'showcase.js'
      - 'portfolio.js'
      - 'portfolio-admin.html'
      - 'portfolio-admin.js'
      - 'portfolio-admin.css'
      - 'orbit-gallery.js'
      - 'content/**'
      - 'showcase-data.js'
      - 'styles.css'
      - 'cinematic.css'
      - 'cinematic.js'
      - 'premium-ui.css'
      - 'premium-ui.js'
      - 'booking.html'
      - 'booking.css'
      - 'booking-premium.css'
      - 'booking.js'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static website
        run: |
          test -s index.html
          test -s photography.html
          test -s film.html
          test -s sound.html
          test -s showcase.css
          test -s showcase.js
          test -s portfolio.js
          test -s portfolio-admin.html
          test -s portfolio-admin.js
          test -s portfolio-admin.css
          test -s orbit-gallery.js
          test -s content/portfolio.json
          test -s showcase-data.js
          test -s styles.css
          test -s cinematic.css
          test -s cinematic.js
          test -s premium-ui.css
          test -s premium-ui.js
          test -s booking.html
          test -s booking.css
          test -s booking-premium.css
          test -s booking.js
          test -s assets/bds-logo.png
      - name: Stage only public assets
        run: |
          mkdir -p public
          cp index.html styles.css cinematic.css cinematic.js premium-ui.css premium-ui.js booking.html booking.css booking-premium.css booking.js public/
          cp photography.html film.html sound.html showcase.css showcase.js showcase-data.js portfolio.js orbit-gallery.js portfolio-admin.html portfolio-admin.js portfolio-admin.css public/
          mkdir -p public/content
          cp content/portfolio.json public/content/
          cp -R assets public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
