name: Deploy BDS Website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'brand.html'
      - 'academy.html'
      - 'contact.html'
      - 'destination.css'
      - 'photography.html'
      - 'film.html'
      - 'sound.html'
      - 'showcase.css'
      - 'hero-globe.css'
      - 'showcase.js'
      - 'portfolio.js'
      - 'portfolio-admin.html'
      - 'portfolio-admin.js'
      - 'portfolio-admin.css'
      - 'orbit-gallery.js'
      - 'content/**'
      - 'scripts/validate_site.py'
      - 'showcase-data.js'
      - 'styles.css'
      - 'cinematic.css'
      - 'cinematic.js'
      - 'premium-ui.css'
      - 'signature-ui.css'
      - 'compact-layout.css'
      - 'premium-ui.js'
      - 'premium-booking-admin.css'
      - 'premium-booking-admin.js'
      - 'booking.html'
      - 'booking.css'
      - 'booking-premium.css'
      - 'booking.js'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static website
        run: |
          test -s index.html
          test -s brand.html
          test -s academy.html
          test -s contact.html
          test -s destination.css
          test -s photography.html
          test -s film.html
          test -s sound.html
          test -s showcase.css
          test -s hero-globe.css
          test -s showcase.js
          test -s portfolio.js
          test -s portfolio-admin.html
          test -s portfolio-admin.js
          test -s portfolio-admin.css
          test -s orbit-gallery.js
          test -s content/portfolio.json
          test -s showcase-data.js
          test -s styles.css
          test -s cinematic.css
          test -s cinematic.js
          test -s premium-ui.css
          test -s signature-ui.css
          test -s compact-layout.css
          test -s premium-ui.js
          test -s premium-booking-admin.css
          test -s premium-booking-admin.js
          test -s booking.html
          test -s booking.css
          test -s booking-premium.css
          test -s booking.js
          test -s assets/bds-logo.png
      - name: Validate JavaScript syntax
        run: |
          for script in *.js; do node --check "$script"; done
      - name: Validate site assets and portfolio data
        run: python3 scripts/validate_site.py
      - name: Stage only public assets
        run: |
          mkdir -p public
          cp index.html brand.html academy.html contact.html destination.css styles.css cinematic.css cinematic.js premium-ui.css signature-ui.css compact-layout.css premium-ui.js premium-booking-admin.css premium-booking-admin.js booking.html booking.css booking-premium.css booking.js public/
          cp photography.html film.html sound.html showcase.css hero-globe.css showcase.js showcase-data.js portfolio.js orbit-gallery.js portfolio-admin.html portfolio-admin.js portfolio-admin.css public/
          mkdir -p public/content
          cp content/portfolio.json public/content/
          cp -R assets public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
