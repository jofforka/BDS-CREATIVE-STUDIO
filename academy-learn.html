<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Cinematography Foundations | BDS Academy</title>
  <link rel="stylesheet" href="academy.css">
  <script src="academy-config.js" defer></script>
  <script type="module" src="academy-learn.js"></script>
</head>
<body class="academy-page academy-preview-page">
  <main class="academy-preview" id="main">
    <nav class="preview-top" aria-label="Academy navigation">
      <a class="preview-back" href="academy-portal.html">← Student portal</a>
      <a class="preview-back" href="academy-course.html?id=demo-cinematography">Free preview</a>
    </nav>
    <header class="preview-header">
      <h1>Cinematography Foundations</h1>
      <p class="preview-summary" id="learn-status" role="status">Checking course access…</p>
      <div class="preview-actions" id="learn-auth" hidden>
        <a class="preview-primary" href="academy-portal.html?mode=register">Create a free student account</a>
        <a class="preview-back" href="academy-portal.html">Sign in</a>
      </div>
    </header>
    <section class="preview-curriculum" id="learn-content" hidden aria-label="Lessons">
      <nav class="preview-outline" aria-label="Course outline">
        <h2>Course outline</h2>
        <div id="learn-outline"></div>
      </nav>
      <article class="preview-lesson" aria-labelledby="learn-title">
        <p class="preview-position" id="learn-position"></p>
        <h2 id="learn-title" tabindex="-1"></h2>
        <p class="preview-instruction" id="learn-body" style="white-space: pre-line"></p>
        <div class="preview-pagination">
          <button id="learn-prev" type="button">← Previous</button>
          <button id="learn-next" type="button">Next lesson →</button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
