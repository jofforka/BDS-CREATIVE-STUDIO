<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lesson Resources Planner | BDS Academy</title><link rel="stylesheet" href="cinematic.css"><link rel="stylesheet" href="academy.css"><link rel="stylesheet" href="academy-workspace.css"><script src="academy-resources.js" defer></script></head><body class="academy-page"><a class="skip-link" href="#main">Skip to content</a><main id="main" class="academy-workspace"><a href="academy.html">← BDS Academy</a><p class="academy-eyebrow">BDS ACADEMY · CONTENT PLANNING</p><h1>Prepare lesson resources.</h1><p class="workspace-note" role="status">Planning preview only. No media is uploaded, stored or shared with students. Do not enter private URLs or secrets.</p><section class="workspace-panel"><form id="resources-form" class="workspace-form"><label for="resource-lesson">Lesson title</label><input id="resource-lesson" maxlength="180" required><label for="resource-transcript">Transcript or lesson notes</label><textarea id="resource-transcript" maxlength="12000" placeholder="Accessible transcript or lesson summary"></textarea><label for="resource-caption">Caption preparation status</label><select id="resource-caption"><option value="needed">Captions needed</option><option value="draft">Draft captions prepared</option><option value="reviewed">Captions reviewed</option></select><label for="resource-items">Resource names (one per line, no URLs)</label><textarea id="resource-items" maxlength="3000" placeholder="Camera checklist&#10;Lighting worksheet"></textarea><button class="workspace-button" type="submit">Validate resource plan</button><button class="workspace-button" type="button" id="resource-copy" disabled>Copy resource plan</button></form><p id="resource-status" role="status" aria-live="polite"></p><pre id="resource-preview" class="workspace-preview" hidden></pre></section></main></body></html>
